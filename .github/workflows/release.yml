name: Release Plugin

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release metadata
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'EOF'
          import manifest from "./manifest.json" with { type: "json" };
          import versions from "./versions.json" with { type: "json" };

          const tag = process.env.GITHUB_REF_NAME;

          if (tag !== manifest.version) {
            throw new Error(
              `Tag "${tag}" must match manifest.json version "${manifest.version}".`,
            );
          }

          if (!(tag in versions)) {
            throw new Error(`versions.json is missing an entry for "${tag}".`);
          }

          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error(
              `versions.json for "${tag}" must match manifest.json minAppVersion "${manifest.minAppVersion}".`,
            );
          }
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
